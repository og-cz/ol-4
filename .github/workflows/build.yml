name: Build OL-4

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxi-dev libxrender-dev libxcomposite-dev libgl1-mesa-dev \
            libfontconfig1-dev libjack-jackd2-dev xvfb ninja-build

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" == "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          if [ "$RUNNER_OS" == "Linux" ]; then EXTRA="-G Ninja"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Engine test (C++ engine vs reference)
        shell: bash
        run: |
          node tests/js_reference.js "$PWD/tests/reference/opto-engine.js" "$PWD/build/ref"
          BIN=$(find build -type f \( -name ol4_engine_match -o -name ol4_engine_match.exe \) | head -1)
          "$BIN" build/ref

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          for b in "build/OL4_artefacts/Release/VST3/OL-4 Optical Leveler.vst3" \
                   "build/OL4_artefacts/Release/AU/OL-4 Optical Leveler.component" \
                   "build/OL4_artefacts/Release/Standalone/OL-4 Optical Leveler.app"; do
            codesign --force --deep --sign - "$b"
          done

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=1.0.0 /DSrcDir="$PWD\build\OL4_artefacts\Release" /O"$PWD\dist" installer\windows.iss
          Compress-Archive -Path "build\OL4_artefacts\Release\VST3\OL-4 Optical Leveler.vst3", "build\OL4_artefacts\Release\Standalone\OL-4 Optical Leveler.exe", "installer\INSTALL-Windows.txt" -DestinationPath "dist\OL-4-Windows-manual.zip"

      - name: Package (macOS installer)
        if: runner.os == 'macOS'
        run: bash installer/make-macos-pkg.sh 1.0.0 build/OL4_artefacts/Release dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cd build/OL4_artefacts/Release
          zip -qry ../../../dist/OL-4-Linux.zip VST3 LV2 Standalone

      - uses: actions/upload-artifact@v4
        with:
          name: OL-4-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
